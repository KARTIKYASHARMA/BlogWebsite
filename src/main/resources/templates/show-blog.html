<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Blogs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .blog-card {
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .blog-image {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
        .blog-content {
            padding: 1rem;
        }
        .blog-meta {
            margin-top: 1rem;
        }
        .like-btn {
            border: none;
            background: none;
            cursor: pointer;
            padding-left: 0;
            color: #dc3545;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/" style="color: #333; font-weight: 600;">
            <i class="fas fa-home me-2"></i> MySite
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/user/home-page/}">HOME</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/user/home-page/show-all-blogs}">ALL BLOGS</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/user/home-page/add-blog/}">ADD BLOG</a></li>
            </ul>
            <div class="d-flex gap-3">
                <a th:href="@{/user/home-page/logout}" class="btn btn-outline-danger">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>

            </div>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<div class="hero-section text-center my-4">
    <h2>My Blogs</h2>
    <p class="text-muted">All your blog posts are shown below.</p>
</div>

<!-- Blog Section -->
<div class="container blog-section">
    <div class="text-end mb-3">
        <a th:href="@{/user/home-page/show-all-blogs}" class="btn btn-sm btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to All Blogs
        </a>
    </div>

    <!-- No blogs -->
    <div th:if="${#lists.isEmpty(blogList)}" class="text-center">
        <i class="fas fa-pen-fancy" style="font-size: 3rem; margin-bottom: 20px; color: #ddd;"></i>
        <p>You haven't published any blogs yet. Start writing!</p>
    </div>

    <!-- Blog List -->
    <div class="row" th:each="blog : ${blogList}">
        <div class="col-12">
            <article class="blog-card">
                <div class="blog-image-container">
                    <img th:src="${blog.imagePath != null ? blog.imagePath : '/default-blog.png'}"
                         class="blog-image" alt="Blog Image">
                </div>
                <div class="blog-content">
                    <h3 class="blog-title" th:text="${blog.title}">Blog Title</h3>
                    <p class="blog-excerpt" th:text="${#strings.abbreviate(blog.content, 120)}">
                        Blog content preview...
                    </p>
                    <a th:href="@{'/user/home-page/show-full-blog/' + ${blog.blogId}}"
                       class="btn btn-sm btn-outline-primary mt-2">Read More</a>

                    <!-- Metadata -->
                    <div class="blog-meta mt-3">
                        <div class="text-muted mb-2">
                            <i class="far fa-calendar-alt me-1"></i>
                            <span th:text="${#dates.format(blog.createdDate, 'MMM dd, yyyy')}">Date</span>
                        </div>
                        <div>
                            <i class="far fa-comment me-1"></i>
                            <span th:text="${#lists.size(blog.comments)} + ' comments'">0 comments</span>
                        </div>

                        <!-- Comments -->
                        <div class="pt-2">
                            <h6>Comments:</h6>
                            <div th:if="${blog.comments != null and !#lists.isEmpty(blog.comments)}">
                                <ul class="list-unstyled">
                                    <li th:each="comment : ${blog.comments}">
                                        <strong th:text="${comment.user.username}">Username</strong>:
                                        <span th:text="${comment.comment}">Comment text</span>
                                    </li>
                                </ul>
                            </div>
                            <div th:if="${blog.comments == null or #lists.isEmpty(blog.comments)}" class="text-muted">
                                No comments yet.
                            </div>
                        </div>

                        <!-- Comment Form -->
                        <form th:action="@{/post}" method="post" class="pt-2">
                            <input type="hidden" name="blogId" th:value="${blog.blogId}" />
                            <textarea name="commentText" class="form-control mb-2" rows="2" placeholder="Write a comment..." required></textarea>
                            <button type="submit" class="btn btn-sm btn-outline-primary">Post Comment</button>
                        </form>

                        <!-- Like Form -->
                        <form th:action="@{/like}" method="post" class="pt-2">
                            <input type="hidden" name="userId" th:value="${currentUserId}" />
                            <input type="hidden" name="blogId" th:value="${blog.blogId}" />
                            <button type="submit" class="like-btn">
                                <i class="fa-heart"
                                   th:classappend="${likedBlogs != null and likedBlogs.contains(blog.blogId)} ? 'fas text-danger' : 'far'"></i>
                                <span th:text="${blogLikeCounts[blog.blogId] ?: 0}">0</span>
                            </button>
                        </form>

                        <!-- Delete Blog Button: Visible only to blog owner -->
                        <div th:if="${currentUserId != null and blog.user.userId == currentUserId}" class="pt-2">
                            <a th:href="@{'/user/home-page/delete-blog/' + ${blog.blogId}}"
                               onclick="return confirm('Are you sure you want to delete this blog?');"
                               class="btn btn-sm btn-danger">
                                <i class="fas fa-trash-alt"></i> Delete
                            </a>
                        </div>
                    </div>
                </div>
            </article>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
