<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .custom-box {
            border: 1px solid #dee2e6;
            padding: 30px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<h1 class="text-center mt-4">Register User</h1>

<div class="container d-flex justify-content-center mt-4">
    <div class="custom-box" style="width: 100%; max-width: 600px;">
        <h3 class="text-center mb-4">Create Account</h3>
        <form
                role="form"
                method="post"
                th:action="@{/home-page/user-saved}"
                th:object="${user}"
        >
            <div class="mb-3">
                <label class="form-label">Name:</label>
                <input type="text" class="form-control" th:field="*{username}" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password:</label>
                <input type="password" class="form-control" th:field="*{password}" placeholder="Enter your password" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
