<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Blog Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="blog-detail">
        <h1 th:text="${blog.title}">Blog Title</h1>
        <p class="text-muted" th:text="${#dates.format(blog.createdDate, 'MMM dd, yyyy')}">Date</p>
        <img th:src="${blog.imagePath != null ? blog.imagePath : '/default-blog.png'}"
             class="img-fluid mb-4" alt="Blog Image"/>

        <div th:text="${blog.content}">Full blog content here...</div>

        <hr>
        <h4>Comments</h4>
        <ul class="list-group mb-3">
            <li class="list-group-item" th:each="comment : ${blog.comments}">
                <strong th:text="${comment.user.username}">Username</strong>:
                <span th:text="${comment.comment}">Comment</span>
            </li>
        </ul>

        <form th:action="@{/post}" method="post">
            <input type="hidden" name="blogId" th:value="${blog.blogId}" />
            <div class="mb-3">
                <textarea name="commentText" class="form-control" rows="3" placeholder="Add your comment" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit Comment</button>
        </form>
    </div>
</div>

</body>
</html>
