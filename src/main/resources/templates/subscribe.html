<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Subscribe</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4>Select a Subscription Plan</h4>
    </div>
    <div class="card-body">
      <form th:action="@{/user/home-page/subscribe}" method="post">
        <input type="hidden" name="userId" th:value="${userId}" />
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="mb-3">
          <label for="type" class="form-label">Subscription Type</label>
          <select name="type" class="form-select" required>
            <option value="" disabled selected>-- Select --</option>
            <option th:each="type : ${subscriptionTypes}"
                    th:value="${type}"
                    th:text="${type}">
            </option>
          </select>
        </div>

        <button type="submit" class="btn btn-success">Subscribe</button>
        <a th:href="@{/user/home-page/show-all-blogs}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
</body>
</html>
